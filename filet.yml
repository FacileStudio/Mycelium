# Mycelium's coding standard, enforced by filet.
# https://github.com/FacileStudio/filet
#
#   filet check .     the rules
#   filet roast .     the rules, with commentary
#   filet docker .    the Dockerfile
#
# Built from the Go family's canonical template. The limits are the published
# defaults of the tools they come from, not numbers picked to make a count go
# away.

kind: app

ignore:
  - .git
  - node_modules
  - vendor
  - dist
  - build
  - testdata
  - coverage

extensions: [.go, .ts, .svelte]

limits:
  fileLines: 250        # filet's own default: split the file
  funcsPerFile: 8
  funcLines: 30         # filet's own default
  funcStatements: 25    # filet's own default
  lineLength: 120       # lll default
  params: 5
  returns: 3
  nesting: 4            # filet's own default
  complexity: 10        # filet's own default
  structFields: 12      # filet's own default
  interfaceMethods: 4   # filet's own default

architecture:
  requiredDirs: [cmd, internal, apps/client]
  # Mycelium's Go server owns all HTTP in internal/server/; cmd/ packages are
  # cobra command definitions and main.go is the entry point. Neither is a
  # domain module of its own — they exist to wire the command tree and are not
  # expected to hold a router.go.
  requiredFiles:
    "internal/server": [server.go, sessions_api.go, usage_api.go]
    "internal/sessions": [sessions.go, store.go, stats.go, scan.go, timeline.go, claude.go, canonical.go, live.go]
    "internal/usage": [usage.go]
    "internal/adapter": [adapter.go]
    "internal/flow": [flow.go, store.go, run.go, trust.go, needs.go, graph.go, schedule.go, query.go, model.go, stream.go]
    "internal/sync": []
    "internal/journal": []
    "internal/memory": []
    "internal/artifacts": []
    "internal/daemon": []
    "internal/cell": []
    "internal/env": []
    "internal/selfupdate": []
    "internal/config": []
    "internal/documentation": []
    "internal/ui": []

style:
  banInlineComments: true
  banTODO: true
  requireDocComments: true
  banGlobalMutable: true
  banInit: true
  banTrailingSpace: true

# The svelte-language-server package ships its binary as `svelteserver`,
# not `svelte-language-server`, so the built-in default never finds it.
lsp:
  servers:
    .svelte: {server: svelteserver}

disabled:
  # gofmt/rustfmt/prettier owns line breaking; every survivor is a line no
  # formatter could have wrapped. Flagging it is noise that teaches people to
  # stop reading the output. Nothing else is disabled: a rule turned off here
  # must be an argument, not a habit.
  - gen.line.long
failOn: error
