<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />

		<title>Mycelium · One brain for your coding agents</title>
		<meta name="description" content="One store of memory, rules and skills for every AI coding agent, synced across all your machines." />
		<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
		<link rel="icon" href="/favicon.ico" sizes="48x48" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
		<link rel="manifest" href="/site.webmanifest" />
		<meta name="theme-color" media="(prefers-color-scheme: light)" content="#fafafa" />
		<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0a0a0a" />
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="Facile" />
		<meta property="og:locale" content="en_US" />
		<meta property="og:url" content="https://mycelium.facile.studio/" />
		<meta property="og:title" content="Mycelium · One brain for your coding agents" />
		<meta property="og:description" content="One store of memory, rules and skills for every AI coding agent, synced across all your machines." />
		<meta property="og:image" content="https://mycelium.facile.studio/og-image.png" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta property="og:image:alt" content="Mycelium: One brain for your coding agents" />
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:title" content="Mycelium · One brain for your coding agents" />
		<meta name="twitter:description" content="One store of memory, rules and skills for every AI coding agent, synced across all your machines." />
		<meta name="twitter:image" content="https://mycelium.facile.studio/og-image.png" />
		<meta name="color-scheme" content="light dark" />
		<script>
			try {
				var theme = localStorage.getItem('mycelium-theme');
				var root = document.documentElement;
				root.classList.toggle('dark', theme === 'dark');
				root.classList.toggle('light', theme === 'light');
			} catch (e) {}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		%sveltekit.body%
	</body>
</html>
